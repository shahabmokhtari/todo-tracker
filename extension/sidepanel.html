<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Todo Tracker</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <section id="setup" class="card setup" hidden>
    <img src="icons/logo.svg" alt="" width="44" height="44">
    <h1>Connect Todo Tracker</h1>
    <p class="muted">Start the Windows sidebar (or <code>TodoTracker.Web</code>), then choose <em>Copy API token</em> in the sidebar menu.</p>
    <form id="setup-form">
      <label>Server <input id="server" value="http://127.0.0.1:5317" required></label>
      <label>API token <input id="token" type="password" autocomplete="off" required></label>
      <button class="btn primary" type="submit">Connect</button>
      <p id="setup-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="main" hidden>
    <header class="top">
      <img class="logo" src="icons/logo.svg" alt="" width="24" height="24">
      <div class="top-text">
        <strong>Todo Tracker</strong>
        <span id="summary" class="muted"></span>
      </div>
      <button id="open" class="icon-btn" title="Open dashboard" aria-label="Open dashboard"></button>
      <button id="settings" class="icon-btn" title="Connection settings" aria-label="Connection settings"></button>
    </header>
    <nav id="tabs" class="tabs" aria-label="Task groups"></nav>

    <form id="capture" class="capture" autocomplete="off">
      <input id="capture-input" placeholder="What's on your mind?  !! @2h" maxlength="300" aria-label="Quick add task">
    </form>

    <div id="focus"></div>

    <form id="note" class="card note">
      <div id="note-target" class="note-target"></div>
      <textarea id="note-text" rows="3" placeholder="What did you find? What's next?" maxlength="10000" aria-label="Note"></textarea>
      <label class="check"><input id="attach" type="checkbox" checked> Attach this page</label>
      <div id="page" class="muted page"></div>
      <button class="btn primary" type="submit">Save note</button>
    </form>

    <details class="card section" open>
      <summary><span>Do now</span><span id="now-count" class="count"></span></summary>
      <ul id="now" class="list"></ul>
    </details>
    <details class="card section">
      <summary><span>Waiting</span><span id="waiting-count" class="count"></span></summary>
      <ul id="waiting" class="list"></ul>
    </details>
    <p id="status" class="muted status" role="status"></p>
  </section>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
