name: TodoTracker
options:
  bundleIdPrefix: com.todotracker
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TodoTrackerKit:
    path: TodoTrackerKit
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Onething
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  TodoTracker-iOS:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: TodoTrackerKit
        product: TodoTrackerKit
      - package: TodoTrackerKit
        product: TodoTrackerUI
      # The home-screen and Lock Screen widgets (Now, Today).
      - target: TodoTrackerWidgets-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todotracker.ios
        PRODUCT_NAME: TodoTracker
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    # todotracker://task/<id> links open the task (TaskLinks); todotracker://pair links connect to a computer. A
    # connected phone talks HTTPS to the computer's address on the local network or Tailscale (an IP address, with
    # the computer's own certificate, trusted by its fingerprint only): local networking is allowed, nothing else.
    info:
      path: Support/Info-iOS.plist
      properties:
        NSCameraUsageDescription: Onething uses the camera to scan the code your computer shows when you connect this phone to it.
        NSLocalNetworkUsageDescription: Onething connects to Onething on your computer, over your Wi-Fi, to use the tasks there.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.todotracker.task-link
            CFBundleURLSchemes: [todotracker]
        # Syncing on its own (Settings › Sync): iOS wakes the app now and then to sync in the background.
        BGTaskSchedulerPermittedIdentifiers: [com.todotracker.ios.sync]
        UIBackgroundModes: [fetch]
        WidgetAppGroup: group.com.todotracker
    # The App Group it shares with its widgets (what they show, and Done tapped on them: WidgetShelf).
    entitlements:
      path: Support/TodoTracker-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.todotracker]
  TodoTracker-macOS:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: TodoTrackerKit
        product: TodoTrackerKit
      - package: TodoTrackerKit
        product: TodoTrackerUI
      # The desktop and Notification Center widgets (Now, Today).
      - target: TodoTrackerWidgets-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todotracker.macos
        PRODUCT_NAME: TodoTracker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Onething puts your tasks in a note when you choose Copy to Apple Notes.
        ENABLE_HARDENED_RUNTIME: YES
    # The app talks to its own server on this Mac over http://127.0.0.1 (loopback only); todotracker://task/<id>
    # links open the task (TaskLinks). The bundle stays TodoTracker.app (PRODUCT_NAME: updates replace it in place,
    # and CI packages it by that name); App/en.lproj/InfoPlist.strings gives the menu bar the name people see
    # (About Onething, Quit Onething).
    info:
      path: Support/Info-macOS.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.todotracker.task-link
            CFBundleURLSchemes: [todotracker]
        WidgetAppGroup: $(TeamIdentifierPrefix)group.com.todotracker
    # On a Mac an App Group starts with the team's id (none when built without one).
    entitlements:
      path: Support/TodoTracker-macOS.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.com.todotracker]
  # The widgets: they read what the app writes to the App Group and never touch the tasks themselves.
  TodoTrackerWidgets-iOS:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: TodoTrackerKit
        product: TodoTrackerKit
      - package: TodoTrackerKit
        product: TodoTrackerWidgetUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todotracker.ios.widgets
        PRODUCT_NAME: OnethingWidgets
        INFOPLIST_KEY_CFBundleDisplayName: Onething
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Support/Info-Widgets-iOS.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WidgetAppGroup: group.com.todotracker
    entitlements:
      path: Support/Widgets-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.todotracker]
  TodoTrackerWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    dependencies:
      - package: TodoTrackerKit
        product: TodoTrackerKit
      - package: TodoTrackerKit
        product: TodoTrackerWidgetUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todotracker.macos.widgets
        PRODUCT_NAME: OnethingWidgets
        INFOPLIST_KEY_CFBundleDisplayName: Onething
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Support/Info-Widgets-macOS.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WidgetAppGroup: $(TeamIdentifierPrefix)group.com.todotracker
    # Widgets on a Mac run in the app sandbox: only the App Group is reachable.
    entitlements:
      path: Support/Widgets-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.com.todotracker]
schemes:
  TodoTracker-iOS:
    build:
      targets:
        TodoTracker-iOS: all
  TodoTracker-macOS:
    build:
      targets:
        TodoTracker-macOS: all
