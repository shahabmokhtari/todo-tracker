name: TodoTracker
options:
  bundleIdPrefix: com.todotracker
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TodoTrackerKit:
    path: TodoTrackerKit
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Todo Tracker
    CODE_SIGN_STYLE: Automatic
targets:
  TodoTracker-iOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TodoTrackerKit
        product: TodoTrackerKit
      - package: TodoTrackerKit
        product: TodoTrackerUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todotracker.ios
        PRODUCT_NAME: TodoTracker
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    # todotracker://task/<id> links open the task (TaskLinks); todotracker://pair links connect to a computer. A
    # connected phone talks HTTPS to the computer's address on the local network or Tailscale (an IP address, with
    # the computer's own certificate, trusted by its fingerprint only): local networking is allowed, nothing else.
    info:
      path: Support/Info-iOS.plist
      properties:
        NSCameraUsageDescription: Todo Tracker uses the camera to scan the code your computer shows when you connect this phone to it.
        NSLocalNetworkUsageDescription: Todo Tracker connects to Todo Tracker on your computer, over your Wi-Fi, to use the tasks there.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.todotracker.task-link
            CFBundleURLSchemes: [todotracker]
        # Syncing on its own (Settings › Sync): iOS wakes the app now and then to sync in the background.
        BGTaskSchedulerPermittedIdentifiers: [com.todotracker.ios.sync]
        UIBackgroundModes: [fetch]
  TodoTracker-macOS:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TodoTrackerKit
        product: TodoTrackerKit
      - package: TodoTrackerKit
        product: TodoTrackerUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todotracker.macos
        PRODUCT_NAME: TodoTracker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Todo Tracker puts your tasks in a note when you choose Copy to Apple Notes.
        ENABLE_HARDENED_RUNTIME: YES
    # The app talks to its own server on this Mac over http://127.0.0.1 (loopback only); todotracker://task/<id>
    # links open the task (TaskLinks).
    info:
      path: Support/Info-macOS.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.todotracker.task-link
            CFBundleURLSchemes: [todotracker]
    entitlements:
      path: App/TodoTracker-macOS.entitlements
      properties:
        com.apple.security.automation.apple-events: true
schemes:
  TodoTracker-iOS:
    build:
      targets:
        TodoTracker-iOS: all
  TodoTracker-macOS:
    build:
      targets:
        TodoTracker-macOS: all
