name: OneThing
options:
  bundleIdPrefix: com.onething
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  OneThingKit:
    path: OneThingKit
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: One Thing
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  OneThing-iOS:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: OneThingKit
        product: OneThingKit
      - package: OneThingKit
        product: OneThingUI
      # The home-screen and Lock Screen widgets (Now, Today).
      - target: OneThingWidgets-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onething.ios
        PRODUCT_NAME: OneThing
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    # onething://task/<id> links open the task (TaskLinks). The app only goes online over HTTPS (gist sync, the
    # feedback relay): no local networking.
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.onething.task-link
            CFBundleURLSchemes: [onething]
        # Syncing on its own (Settings › Sync): iOS wakes the app now and then to sync in the background.
        BGTaskSchedulerPermittedIdentifiers: [com.onething.ios.sync]
        UIBackgroundModes: [fetch]
        WidgetAppGroup: group.com.onething
    # The App Group it shares with its widgets (what they show, and Done tapped on them: WidgetShelf).
    entitlements:
      path: Support/OneThing-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.onething]
  OneThing-macOS:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: OneThingKit
        product: OneThingKit
      - package: OneThingKit
        product: OneThingUI
      # The desktop and Notification Center widgets (Now, Today).
      - target: OneThingWidgets-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onething.macos
        PRODUCT_NAME: OneThing
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: One Thing puts your tasks in a note when you choose Copy to Apple Notes.
        ENABLE_HARDENED_RUNTIME: YES
    # The app talks to its own server on this Mac over http://127.0.0.1 (loopback only); onething://task/<id>
    # links open the task (TaskLinks). The bundle stays OneThing.app (PRODUCT_NAME: updates replace it in place,
    # and CI packages it by that name); App/en.lproj/InfoPlist.strings gives the menu bar the name people see
    # (About One Thing, Quit One Thing).
    info:
      path: Support/Info-macOS.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.onething.task-link
            CFBundleURLSchemes: [onething]
        WidgetAppGroup: $(TeamIdentifierPrefix)group.com.onething
    # On a Mac an App Group starts with the team's id (none when built without one).
    entitlements:
      path: Support/OneThing-macOS.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.com.onething]
  # The widgets: they read what the app writes to the App Group and never touch the tasks themselves.
  OneThingWidgets-iOS:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: OneThingKit
        product: OneThingKit
      - package: OneThingKit
        product: OneThingWidgetUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onething.ios.widgets
        PRODUCT_NAME: OneThingWidgets
        INFOPLIST_KEY_CFBundleDisplayName: One Thing
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Support/Info-Widgets-iOS.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WidgetAppGroup: group.com.onething
    entitlements:
      path: Support/Widgets-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.onething]
  OneThingWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    dependencies:
      - package: OneThingKit
        product: OneThingKit
      - package: OneThingKit
        product: OneThingWidgetUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onething.macos.widgets
        PRODUCT_NAME: OneThingWidgets
        INFOPLIST_KEY_CFBundleDisplayName: One Thing
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Support/Info-Widgets-macOS.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WidgetAppGroup: $(TeamIdentifierPrefix)group.com.onething
    # Widgets on a Mac run in the app sandbox: only the App Group is reachable.
    entitlements:
      path: Support/Widgets-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.com.onething]
schemes:
  OneThing-iOS:
    build:
      targets:
        OneThing-iOS: all
  OneThing-macOS:
    build:
      targets:
        OneThing-macOS: all
