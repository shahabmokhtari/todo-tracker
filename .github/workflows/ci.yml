name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  core:
    name: Core, server, CLI & view models (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: |
          for p in Core Server Desktop Cli; do
            dotnet build tests/TodoTracker.$p.Tests --configuration Release -warnaserror
          done
      - name: Test with coverage
        run: |
          for p in Core Server Desktop Cli; do
            dotnet test --project tests/TodoTracker.$p.Tests --configuration Release --no-build \
              --coverage --coverage-settings build/coverage.config --coverage-output-format cobertura --coverage-output $p.cobertura.xml \
              --results-directory TestResults/$p
          done
      - name: Coverage gate
        run: |
          python3 build/coverage-gate.py "$(find TestResults/Core -name Core.cobertura.xml)" TodoTracker.Core=90
          python3 build/coverage-gate.py "$(find TestResults/Server -name Server.cobertura.xml)" TodoTracker.Server=85
          python3 build/coverage-gate.py "$(find TestResults/Desktop -name Desktop.cobertura.xml)" TodoTracker.Desktop=85
          python3 build/coverage-gate.py "$(find TestResults/Cli -name Cli.cobertura.xml)" tt=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: TestResults/**/*.cobertura.xml

  web:
    name: Web UI, extension & browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript unit tests
        run: node --test tests/web/*.test.mjs extension/tests/*.test.mjs
      - name: Build web host (and the scripted agent the Ask AI test talks to)
        run: |
          dotnet build src/TodoTracker.Web --configuration Release -warnaserror
          dotnet build tests/FakeAcpAgent --configuration Release -warnaserror
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        working-directory: tests/e2e
        env:
          CI: "1"
          E2E_CONFIGURATION: Release
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Package browser extension (Edge/Chrome, and the Safari web extension folder)
        run: |
          (cd extension && zip -r ../todo-tracker-extension.zip . -x 'tests/*' 'safari/*')
          mkdir -p safari-src && rsync -a --exclude tests --exclude safari extension/ safari-src/
          cp extension/safari/manifest.json safari-src/manifest.json
          (cd safari-src && zip -r ../todo-tracker-extension-safari.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: |
            todo-tracker-extension.zip
            todo-tracker-extension-safari.zip

  connectors:
    name: AI connectors (tt CLI, Claude Desktop extension, plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the Claude Desktop extension manifest
        run: npx --yes @anthropic-ai/mcpb validate integrations/claude-desktop/manifest.json
      - name: Validate plugin and marketplace JSON
        run: |
          for f in .claude-plugin/marketplace.json .github/plugin/marketplace.json integrations/agent-plugin/.claude-plugin/plugin.json integrations/agent-plugin/.mcp.json integrations/vscode/mcp.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: dotnet tool package (dotnet tool install -g TodoTracker.Cli --add-source <folder>)
        run: dotnet pack src/TodoTracker.Cli --configuration Release --output artifacts/nuget
      - name: Self-contained tt and Claude Desktop extensions
        run: |
          for rid in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64; do
            dotnet publish src/TodoTracker.Cli --configuration Release --runtime $rid --self-contained \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none \
              --output publish/$rid
            python3 build/package-mcpb.py $rid publish/$rid staging/$rid
            npx --yes @anthropic-ai/mcpb pack staging/$rid artifacts/todo-tracker-$rid.mcpb
            (cd publish/$rid && zip -q ../../artifacts/tt-$rid.zip *)
          done
      - name: Smoke test tt mcp from the Linux bundle
        run: |
          unzip -q -o artifacts/todo-tracker-linux-x64.mcpb -d bundle
          python3 build/mcp-smoke.py bundle/server/tt
      - uses: actions/upload-artifact@v4
        with:
          name: ai-connectors
          path: artifacts

  windows:
    name: Windows desktop (WPF)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build solution
        run: dotnet build TodoTracker.slnx --configuration Release -warnaserror
      - name: Test
        run: dotnet test --solution TodoTracker.slnx --configuration Release --no-build
      - name: Publish sidebar
        run: dotnet publish src/TodoTracker.Windows --configuration Release --runtime win-x64 --self-contained false --output artifacts/windows
      - name: Smoke test the real app
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\smoke.log"
          $shot = "$env:GITHUB_WORKSPACE\artifacts\sidebar.png"
          $p = Start-Process artifacts\windows\TodoTracker.exe -ArgumentList '--smoke-test','--smoke-log',$log,'--screenshot',$shot -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Smoke test timed out' }
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: System test (sidebar placement via UI Automation)
        shell: pwsh
        run: ./tests/system/placement.system-test.ps1 -Exe "$env:GITHUB_WORKSPACE\artifacts\windows\TodoTracker.exe"
      - name: System test (multi-monitor; skips on single-monitor runners)
        shell: pwsh
        run: ./tests/system/multimonitor.system-test.ps1 -Exe "$env:GITHUB_WORKSPACE\artifacts\windows\TodoTracker.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-sidebar
          path: artifacts

  apple:
    name: macOS & iOS (Swift)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Swift tests (shared scenarios, presentation, UI snapshots)
        working-directory: apple/TodoTrackerKit
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: swift test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiftui-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
      - name: Generate Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iOS app (simulator)
        working-directory: apple
        run: >
          xcodebuild -project TodoTracker.xcodeproj -scheme TodoTracker-iOS
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS app
        working-directory: apple
        run: >
          xcodebuild -project TodoTracker.xcodeproj -scheme TodoTracker-macOS
          -destination 'platform=macOS' -configuration Release
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Put the sync server in the Mac app (the tasks folder, synced with the other computers)
        run: |
          dotnet publish src/TodoTracker.Web --configuration Release --runtime osx-arm64 --self-contained -p:PublishSingleFile=true --output artifacts/mac-server
          app=apple/DerivedData/Build/Products/Release/TodoTracker.app
          mkdir -p "$app/Contents/Resources/Server"
          cp -R artifacts/mac-server/. "$app/Contents/Resources/Server/"
          rm -f "$app/Contents/Resources/Server/"*.pdb
          # Changed after the build: sign the whole app again (ad hoc, as before).
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$app"
      - name: The bundled server starts and stops with the app that started it
        run: |
          server=apple/DerivedData/Build/Products/Release/TodoTracker.app/Contents/Resources/Server/TodoTracker.Web
          data=$(mktemp -d)
          sleep 600 & parent=$!
          TODOTRACKER_CLOUD=off TODOTRACKER_DATA="$data" TODOTRACKER_VAULT="$data/vault" TODOTRACKER_TOKEN=ci-token-0123456789abcdefghijklmnop \
            "$server" --port 5399 --parent-pid "$parent" > "$data/server.log" 2>&1 &
          server_pid=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5399/health > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5399/health
          curl -fsS -H 'Authorization: Bearer ci-token-0123456789abcdefghijklmnop' http://127.0.0.1:5399/api/export | head -c 200; echo
          kill "$parent"
          for i in $(seq 1 20); do kill -0 "$server_pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$server_pid" 2>/dev/null; then echo 'The server outlived its app'; cat "$data/server.log"; exit 1; fi
      - name: Package macOS app
        working-directory: apple
        run: ditto -c -k --keepParent DerivedData/Build/Products/Release/TodoTracker.app TodoTracker-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apple/TodoTracker-macOS.zip
      - name: Safari extension (an ad-hoc signed Mac app that carries the web extension)
        run: |
          mkdir -p safari-src && rsync -a --exclude tests --exclude safari extension/ safari-src/
          cp extension/safari/manifest.json safari-src/manifest.json
          xcrun safari-web-extension-converter safari-src --project-location safari-build --app-name "Todo Tracker Extension" --bundle-identifier dev.todotracker.extension --macos-only --copy-resources --no-open --no-prompt --force
          project=$(find safari-build -name '*.xcodeproj' -maxdepth 3 | head -1)
          # The converter names the app and its extension inconsistently; signing requires the extension's bundle id
          # to start with the app's. Set both (and the id the app's code uses to find its extension).
          python3 - "$project" <<'PY'
          import glob, re, sys
          project = sys.argv[1]
          path = f"{project}/project.pbxproj"
          text = open(path).read()
          old = set()
          def fix(match):
              block = match.group(0)
              found = re.search(r'PRODUCT_BUNDLE_IDENTIFIER = "?([^";]+)"?;', block)
              if not found:
                  return block
              appex = "SKIP_INSTALL = YES" in block or "Extension Extension" in block
              new = "dev.todotracker.safari.extension" if appex else "dev.todotracker.safari"
              if appex:
                  old.add(found.group(1))
              return block.replace(found.group(0), f"PRODUCT_BUNDLE_IDENTIFIER = {new};")
          text = re.sub(r"buildSettings = \{.*?\n\t\t\t\};", fix, text, flags=re.S)
          open(path, "w").write(text)
          for swift in glob.glob(f"{project}/../**/*.swift", recursive=True):
              code = open(swift).read()
              for ext in old:
                  code = code.replace(f'"{ext}"', '"dev.todotracker.safari.extension"')
              open(swift, "w").write(code)
          print("extension ids replaced:", old)
          PY
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$project/project.pbxproj"
          xcodebuild -list -project "$project"
          # Ad-hoc signed ("-"): Safari won't load an extension app with no signature at all, even with "Allow
          # Unsigned Extensions" on. Users still clear the download quarantine (docs/browser-extension.md).
          xcodebuild -project "$project" -scheme "Todo Tracker Extension" -configuration Release -derivedDataPath safari-build/dd CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          codesign --verify --deep --verbose=2 "safari-build/dd/Build/Products/Release/Todo Tracker Extension.app"
          ditto -c -k --keepParent "safari-build/dd/Build/Products/Release/Todo Tracker Extension.app" TodoTracker-Safari-Extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: safari-extension
          path: TodoTracker-Safari-Extension.zip
