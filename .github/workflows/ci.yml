name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  # The release workflow (release.yml) runs all of this on a version tag, then publishes what it built.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  core:
    name: Core, server, CLI & view models (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build
        run: |
          for p in Core Server Desktop Cli; do
            dotnet build tests/OneThing.$p.Tests --configuration Release -warnaserror
          done
      - name: Test with coverage
        run: |
          for p in Core Server Desktop Cli; do
            dotnet test --project tests/OneThing.$p.Tests --configuration Release --no-build \
              --coverage --coverage-settings build/coverage.config --coverage-output-format cobertura --coverage-output $p.cobertura.xml \
              --results-directory TestResults/$p
          done
      - name: Coverage gate
        run: |
          python3 build/coverage-gate.py "$(find TestResults/Core -name Core.cobertura.xml)" OneThing.Core=90
          python3 build/coverage-gate.py "$(find TestResults/Server -name Server.cobertura.xml)" OneThing.Server=85
          python3 build/coverage-gate.py "$(find TestResults/Desktop -name Desktop.cobertura.xml)" OneThing.Desktop=85
          python3 build/coverage-gate.py "$(find TestResults/Cli -name Cli.cobertura.xml)" onething=85
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: TestResults/**/*.cobertura.xml

  linux-tray:
    name: Linux tray app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build and test
        run: |
          dotnet build tests/OneThing.Tray.Tests --configuration Release -warnaserror
          ONETHING_CLOUD=off dotnet test --project tests/OneThing.Tray.Tests --configuration Release --no-build
      - name: Package (self-contained, no .NET needed)
        run: |
          dotnet publish src/OneThing.Tray --configuration Release --runtime linux-x64 --self-contained --output artifacts/onething/app
          rm -f artifacts/onething/app/*.pdb
          cp packaging/linux/install.sh packaging/linux/onething.desktop packaging/linux/onething.png artifacts/onething/
          chmod +x artifacts/onething/install.sh artifacts/onething/app/onething-tray artifacts/onething/app/onething artifacts/onething/app/ot
          tar -C artifacts -czf onething-linux-x64.tar.gz onething
      - name: The packaged app starts (no display needed)
        run: ONETHING_CLOUD=off artifacts/onething/app/onething-tray --smoke-test --data "$(mktemp -d)" --port 5398
      - name: The packaged command line runs by both names
        run: |
          data=$(mktemp -d)
          ONETHING_CLOUD=off artifacts/onething/app/onething now --data "$data"
          ONETHING_CLOUD=off artifacts/onething/app/ot now --data "$data"
      - name: The tray app runs on a desktop (virtual display) and serves the tasks
        run: |
          sudo apt-get install -y xvfb > /dev/null
          data=$(mktemp -d)
          ONETHING_CLOUD=off xvfb-run -a artifacts/onething/app/onething-tray --data "$data" --port 5397 > tray.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5397/health > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:5397/health || { cat tray.log; exit 1; }
          sleep 3
          pgrep -f 'onething-tray --data' > /dev/null || { echo 'The tray app stopped'; cat tray.log; exit 1; }
          # Asked to stop (as at logout): it quits by itself, notes saved.
          pkill -TERM -f 'onething-tray --data' || true
          for i in $(seq 1 15); do pgrep -f 'onething-tray --data' > /dev/null || break; sleep 1; done
          if pgrep -f 'onething-tray --data' > /dev/null; then echo 'It ignored SIGTERM'; cat tray.log; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-tray
          path: onething-linux-x64.tar.gz

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests (the agenda scenarios every app checks, the board file, quick capture)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build the app
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: android-test-report
          path: android/app/build/reports/tests
  web:
    name: Web UI, extension & browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: JavaScript unit tests
        run: node --test tests/web/*.test.mjs extension/tests/*.test.mjs
      - name: Build web host (and the scripted agent the Ask AI test talks to)
        run: |
          dotnet build src/OneThing.Web --configuration Release -warnaserror
          dotnet build tests/FakeAcpAgent --configuration Release -warnaserror
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        working-directory: tests/e2e
        env:
          CI: "1"
          E2E_CONFIGURATION: Release
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Package browser extension (Edge/Chrome, and the Safari web extension folder)
        run: |
          (cd extension && zip -r ../onething-extension.zip . -x 'tests/*' 'safari/*')
          mkdir -p safari-src && rsync -a --exclude tests --exclude safari extension/ safari-src/
          cp extension/safari/manifest.json safari-src/manifest.json
          (cd safari-src && zip -r ../onething-extension-safari.zip .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-extension
          path: |
            onething-extension.zip
            onething-extension-safari.zip

  connectors:
    name: AI connectors (onething/ot CLI, Claude Desktop extension, plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate the Claude Desktop extension manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate integrations/claude-desktop/manifest.json
      - name: Validate plugin and marketplace JSON
        run: |
          for f in .claude-plugin/marketplace.json .github/plugin/marketplace.json integrations/agent-plugin/.claude-plugin/plugin.json integrations/agent-plugin/.mcp.json integrations/vscode/mcp.json; do
            python3 -m json.tool "$f" > /dev/null || exit 1
            echo "ok $f"
          done
      - name: dotnet tool package (dotnet tool install -g OneThing.Cli --add-source <folder>)
        run: dotnet pack src/OneThing.Cli --configuration Release --output artifacts/nuget
      - name: Self-contained onething (and ot) and Claude Desktop extensions
        run: |
          for rid in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64; do
            dotnet publish src/OneThing.Cli --configuration Release --runtime $rid --self-contained \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none \
              --output publish/$rid
            python3 build/package-mcpb.py $rid publish/$rid staging/$rid
            npx --yes @anthropic-ai/mcpb@2.1.2 pack staging/$rid artifacts/onething-$rid.mcpb
            (cd publish/$rid && zip -q ../../artifacts/onething-cli-$rid.zip *)
          done
      - name: Smoke test onething mcp from the Linux bundle
        run: |
          unzip -q -o artifacts/onething-linux-x64.mcpb -d bundle
          python3 build/mcp-smoke.py bundle/server/onething
          publish/linux-x64/onething --version
          publish/linux-x64/ot --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-connectors
          path: artifacts

  windows:
    name: Windows desktop (WPF)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build solution
        run: dotnet build OneThing.slnx --configuration Release -warnaserror
      - name: Test
        run: dotnet test --solution OneThing.slnx --configuration Release --no-build
      - name: Publish sidebar
        run: dotnet publish src/OneThing.Windows --configuration Release --runtime win-x64 --self-contained false --output artifacts/windows
      - name: The command line ships next to the app by both names
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cli-data'
          $env:ONETHING_CLOUD = 'off'
          foreach ($name in 'onething', 'ot') {
            & "artifacts\windows\cli\$name.exe" now --data $data
            if ($LASTEXITCODE -ne 0) { throw "$name failed with exit code $LASTEXITCODE" }
          }
      - name: Smoke test the real app
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\smoke.log"
          $shot = "$env:GITHUB_WORKSPACE\artifacts\sidebar.png"
          $p = Start-Process artifacts\windows\OneThing.exe -ArgumentList '--smoke-test','--smoke-log',$log,'--screenshot',$shot -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Smoke test timed out' }
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: System test (sidebar placement via UI Automation)
        shell: pwsh
        run: ./tests/system/placement.system-test.ps1 -Exe "$env:GITHUB_WORKSPACE\artifacts\windows\OneThing.exe"
      - name: System test (multi-monitor; skips on single-monitor runners)
        shell: pwsh
        run: ./tests/system/multimonitor.system-test.ps1 -Exe "$env:GITHUB_WORKSPACE\artifacts\windows\OneThing.exe"
      - name: System test (full-screen windows, Remote Desktop, hiding)
        shell: pwsh
        run: ./tests/system/fullscreen.system-test.ps1 -Exe "$env:GITHUB_WORKSPACE\artifacts\windows\OneThing.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-sidebar
          path: artifacts

  apple:
    name: macOS & iOS (Swift)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Swift tests (shared scenarios, presentation, UI snapshots)
        working-directory: apple/OneThingKit
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: swift test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: swiftui-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
      - name: Generate Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iOS app (simulator)
        working-directory: apple
        run: >
          xcodebuild -project OneThing.xcodeproj -scheme OneThing-iOS
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: The iOS app carries its widgets
        run: test -d apple/DerivedData/Build/Products/Debug-iphonesimulator/OneThing.app/PlugIns/OneThingWidgets.appex
      - name: Build macOS app
        working-directory: apple
        run: >
          xcodebuild -project OneThing.xcodeproj -scheme OneThing-macOS
          -destination 'platform=macOS' -configuration Release
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: The macOS app carries its widgets
        run: test -d apple/DerivedData/Build/Products/Release/OneThing.app/Contents/PlugIns/OneThingWidgets.appex
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Put the sync server in the Mac app (the tasks folder, synced with the other computers)
        run: |
          dotnet publish src/OneThing.Web --configuration Release --runtime osx-arm64 --self-contained -p:PublishSingleFile=true --output artifacts/mac-server
          app=apple/DerivedData/Build/Products/Release/OneThing.app
          mkdir -p "$app/Contents/Resources/Server"
          cp -R artifacts/mac-server/. "$app/Contents/Resources/Server/"
          rm -f "$app/Contents/Resources/Server/"*.pdb
          # Changed after the build: sign it again (ad hoc), inside out and each part with its own entitlements, so
          # the widgets keep their sandbox and App Group (--deep would sign them with none and they wouldn't load).
          # The entitlements files say $(TeamIdentifierPrefix)group…: use the App Group the build put in Info.plist.
          group=$(/usr/libexec/PlistBuddy -c 'Print :WidgetAppGroup' "$app/Contents/Info.plist")
          entitlements() { sed "s|\$(TeamIdentifierPrefix)group.com.onething|$group|g" "apple/Support/$1" > "$RUNNER_TEMP/$1"; echo "$RUNNER_TEMP/$1"; }
          if [ -d "$app/Contents/Frameworks" ]; then
            find "$app/Contents/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          fi
          appex="$app/Contents/PlugIns/OneThingWidgets.appex"
          codesign --force --sign - --entitlements "$(entitlements Widgets-macOS.entitlements)" "$appex"
          codesign --force --sign - --entitlements "$(entitlements OneThing-macOS.entitlements)" "$app"
          codesign --verify --deep "$app"
          signed=$(codesign -d --entitlements - "$appex" 2>/dev/null)
          case "$signed" in *com.apple.security.app-sandbox*) ;; *) echo 'The widgets lost their sandbox'; exit 1 ;; esac
          case "$signed" in *"$group"*) ;; *) echo 'The widgets lost their App Group'; exit 1 ;; esac
      - name: The bundled server starts and stops with the app that started it
        run: |
          server=apple/DerivedData/Build/Products/Release/OneThing.app/Contents/Resources/Server/OneThing.Web
          data=$(mktemp -d)
          sleep 600 & parent=$!
          ONETHING_CLOUD=off ONETHING_DATA="$data" ONETHING_VAULT="$data/vault" ONETHING_TOKEN=ci-token-0123456789abcdefghijklmnop \
            "$server" --port 5399 --parent-pid "$parent" > "$data/server.log" 2>&1 &
          server_pid=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5399/health > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5399/health || { cat "$data/server.log"; exit 1; }
          curl -fsS -H 'Authorization: Bearer ci-token-0123456789abcdefghijklmnop' http://127.0.0.1:5399/api/export | head -c 200; echo
          kill "$parent"
          for i in $(seq 1 20); do kill -0 "$server_pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$server_pid" 2>/dev/null; then echo 'The server outlived its app'; cat "$data/server.log"; exit 1; fi
      - name: Package macOS app
        working-directory: apple
        run: ditto -c -k --keepParent DerivedData/Build/Products/Release/OneThing.app OneThing-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apple/OneThing-macOS.zip
      - name: Safari extension (an ad-hoc signed Mac app that carries the web extension)
        run: |
          mkdir -p safari-src && rsync -a --exclude tests --exclude safari extension/ safari-src/
          cp extension/safari/manifest.json safari-src/manifest.json
          xcrun safari-web-extension-converter safari-src --project-location safari-build --app-name "One Thing Extension" --bundle-identifier dev.onething.extension --macos-only --copy-resources --no-open --no-prompt --force
          project=$(find safari-build -name '*.xcodeproj' -maxdepth 3 | head -1)
          # The converter names the app and its extension inconsistently; signing requires the extension's bundle id
          # to start with the app's. Set both (and the id the app's code uses to find its extension).
          python3 - "$project" <<'PY'
          import glob, re, sys
          project = sys.argv[1]
          path = f"{project}/project.pbxproj"
          text = open(path).read()
          old = set()
          def fix(match):
              block = match.group(0)
              found = re.search(r'PRODUCT_BUNDLE_IDENTIFIER = "?([^";]+)"?;', block)
              if not found:
                  return block
              appex = "SKIP_INSTALL = YES" in block or "Extension Extension" in block
              new = "dev.onething.safari.extension" if appex else "dev.onething.safari"
              if appex:
                  old.add(found.group(1))
              return block.replace(found.group(0), f"PRODUCT_BUNDLE_IDENTIFIER = {new};")
          text = re.sub(r"buildSettings = \{.*?\n\t\t\t\};", fix, text, flags=re.S)
          open(path, "w").write(text)
          for swift in glob.glob(f"{project}/../**/*.swift", recursive=True):
              code = open(swift).read()
              for ext in old:
                  code = code.replace(f'"{ext}"', '"dev.onething.safari.extension"')
              open(swift, "w").write(code)
          print("extension ids replaced:", old)
          PY
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$project/project.pbxproj"
          xcodebuild -list -project "$project"
          # Ad-hoc signed ("-"): Safari won't load an extension app with no signature at all, even with "Allow
          # Unsigned Extensions" on. Users still clear the download quarantine (docs/browser-extension.md).
          xcodebuild -project "$project" -scheme "One Thing Extension" -configuration Release -derivedDataPath safari-build/dd CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          codesign --verify --deep --verbose=2 "safari-build/dd/Build/Products/Release/One Thing Extension.app"
          ditto -c -k --keepParent "safari-build/dd/Build/Products/Release/One Thing Extension.app" OneThing-Safari-Extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: safari-extension
          path: OneThing-Safari-Extension.zip
